{% extends "admin/change_form.html" %}

{% block after_field_sets %}
{{ block.super }}

{% if original %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Find the BOQ items tab
    const boqTab = document.querySelector('a[href="#boq-items-tab"]');
    if (boqTab) {
        // Get the tab content
        const tabContent = document.querySelector('#boq-items-tab');
        if (tabContent) {
            // Add a header and button before the inline form
            const header = document.createElement('div');
            header.style.cssText = 'display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 10px; background: #f8fafc; border-radius: 6px; border: 1px solid #e2e8f0;';
            header.innerHTML = `
                <div>
                    <strong style="font-size: 14px;">📋 BOQ Items</strong>
                    <span style="color: #64748b; font-size: 12px; margin-left: 10px;">
                        ${document.querySelectorAll('#boq_items-group tbody tr:not(.empty-form)').length || 0} items
                    </span>
                </div>
                <div>
                    <a href="#" onclick="document.querySelector('#boq_items-group .add-row a')?.click(); return false;" 
                       style="background: #10b981; color: white; padding: 6px 16px; border-radius: 4px; text-decoration: none; display: inline-block; font-size: 13px;">
                        ➕ Add BOQ Item
                    </a>
                </div>
            `;
            
            // Insert the header at the beginning of the tab content
            const firstChild = tabContent.firstChild;
            if (firstChild) {
                tabContent.insertBefore(header, firstChild);
            } else {
                tabContent.appendChild(header);
            }
        }
    }
});
</script>
{% endif %}
{% endblock %}
